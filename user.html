<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceit Widget</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bytesized&family=Doto&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Main Widget -->
    <div class="main-homepage">
        <div style="display: flex; align-items: center;">
            <div>
                <img class="image-glow" id="level-pic" alt="" loading="lazy" width="64" height="64" decoding="async" src="https://faceit-widget.pages.dev/assets/icons/skill_level/skill_level_0.svg" style="margin-right: 20px; color: white;">
            </div>
            <div>
                <div style="display: flex; align-items: center; margin-bottom: 5px;">
                    <a class="noline text-glow text-colour-white text-center header" id="nicknameValue" style="font-weight: 500 !important;">Username</a>
                    <img id="country-flag" style="height: 16px; width: 24px; margin-left: 8px; vertical-align: middle; display: none; border-radius: 2px;" alt="Country Flag">
                </div>
                
                <div>
                    <a class="noline subtext text-glow-large text-colour-white font-inter" id="eloValue" style="font-weight: 400 !important;">***</a>
                    <a class="noline subtext text-glow-small text-colour-white font-inter" id="eloValue" style="font-weight: 400 !important;"> Elo </a>
                        <span class="subtext text-glow-small text-colour-white font-inter"> | </span>
                    <a class="noline subtext text-glow-large text-colour-white font-inter" id="kdValue" style="font-weight: 400 !important;">***</a>
                        <span class="subtext text-glow-small text-colour-white font-inter" style="font-weight: 400 !important;"> K/D </span>
                        <span class="subtext text-glow-small text-colour-white font-inter"> | </span>
                    <a class="noline subtext text-glow-large text-colour-white font-inter" id="adrValue" style="font-weight: 400 !important;">***</a>
                        <span class="subtext text-glow-small text-colour-white font-inter" style="font-weight: 400 !important;"> ADR </span>
                        <span class="subtext text-glow-small text-colour-white font-inter"> | </span>
                    <a class="noline subtext text-glow-large text-colour-white font-inter" id="avgKillsValue" style="font-weight: 400 !important;">***</a>
                        <span class="subtext text-glow-small text-colour-white font-inter" style="font-weight: 400 !important;"> Avg </span>
                </div>
                
                <div class="recent-games hidden" id="recentGamesRow" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

<script>
    // --- Element References ---
    const nicknameDisplay = document.getElementById('nicknameValue');
    const eloDisplay = document.getElementById('eloValue');
    const kdDisplay = document.getElementById('kdValue');
    const adrDisplay = document.getElementById('adrValue');
    const avgKillsDisplay = document.getElementById('avgKillsValue');
    const levelPic = document.getElementById('level-pic');
    const countryFlag = document.getElementById('country-flag');
    const recentGamesRow = document.getElementById('recentGamesRow');

    // --- Read URL Parameters ---
    const urlParams = new URLSearchParams(window.location.search);
    const user = urlParams.get('user') || '';
    const showRecent = urlParams.get('recent') === 'true';
    const showFlag = urlParams.get('flag') === 'true';
    const font = urlParams.get('font') || 'Bytesized';

    // Apply the font immediately
    nicknameDisplay.style.fontFamily = `'${font}', sans-serif`;
    nicknameDisplay.classList.add(`font-${font.toLowerCase()}`);

    // --- Recent Games Render Logic ---
    function renderRecentGames(recentGamesData) {
        recentGamesRow.innerHTML = ''; 
        
        if (showRecent) {
            recentGamesRow.classList.remove('hidden');
            recentGamesRow.style.display = 'flex';
            recentGamesRow.style.gap = '8px';
            recentGamesRow.style.marginTop = '10px';

            const last5 = recentGamesData.slice(-5).reverse();

            last5.forEach(game => {
                const gameDiv = document.createElement('div');
                gameDiv.style.width = '24px';
                gameDiv.style.height = '24px';
                gameDiv.style.display = 'flex';
                gameDiv.style.alignItems = 'center';
                gameDiv.style.justifyContent = 'center';
                gameDiv.style.borderRadius = '4px';
                gameDiv.style.fontWeight = 'bold';
                gameDiv.style.fontSize = '14px';
                gameDiv.style.fontFamily = "'Inter', sans-serif";
                
                if (game.result === 'W') {
                    gameDiv.style.background = '#4caf50';
                    gameDiv.style.color = '#fff';
                    gameDiv.innerText = 'W';
                } else {
                    gameDiv.style.background = '#f44336';
                    gameDiv.style.color = '#fff';
                    gameDiv.innerText = 'L';
                }
                
                recentGamesRow.appendChild(gameDiv);
            });
        } else {
            recentGamesRow.classList.add('hidden');
            recentGamesRow.style.display = 'none';
        }
    }

    // --- Fetch Stats from Backend ---
    async function fetchStats(nickname) {
        // Don't show "Loading..." on subsequent auto-refreshes to prevent flickering
        if (nicknameDisplay.innerText === 'Username' || nicknameDisplay.innerText === 'No user specified') {
            nicknameDisplay.innerText = "Loading...";
        }

        try {
            const response = await fetch(`/api/stats/${encodeURIComponent(nickname)}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to fetch stats');
            }

            nicknameDisplay.innerText = data.nickname;
            eloDisplay.innerText = data.elo;
            kdDisplay.innerText = data.kd;
            adrDisplay.innerText = data.adr;
            avgKillsDisplay.innerText = data.avgKills;

            if (data.country && showFlag) {
                countryFlag.src = `https://flagcdn.com/24x18/${data.country.toLowerCase()}.png`;
                countryFlag.alt = data.country;
                countryFlag.style.display = 'inline-block';
            }

            if (data.isChallenger) {
                levelPic.src = "assets/challanger.svg";
            } else {
                const level = data.level || 0;
                levelPic.src = `https://faceit-widget.pages.dev/assets/icons/skill_level/skill_level_${level}.svg`;
            }

            renderRecentGames(data.recentGames || []);

        } catch (error) {
            console.error("Error:", error);
        }
    }

    // --- Auto-Fetch Logic ---
    if (user) {
        // 1. Fetch immediately on page load
        fetchStats(user);
        
        // 2. Set interval to auto-refresh every 5 minutes (300,000 ms)
        // This will automatically update your Elo, K/D, ADR, and recent games after you finish a match!
        setInterval(() => {
            fetchStats(user);
        }, 300000); 
    } else {
        nicknameDisplay.innerText = "No user specified";
    }
</script>

</body>
</html>
